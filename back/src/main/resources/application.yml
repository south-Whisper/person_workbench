spring:
  application:
    name: sethub
  datasource:
    url: ${SETHUB_DB_URL:jdbc:mysql://localhost:3306/sethub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${SETHUB_DB_USER:root}
    password: ${SETHUB_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  web:
    error:
      include-message: never
server:
  port: ${PORT:8080}
sethub:
  jwt-secret: ${SETHUB_JWT_SECRET:}
  data-dir: ${SETHUB_DATA_DIR:./data}
  cors-origins: ${SETHUB_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
